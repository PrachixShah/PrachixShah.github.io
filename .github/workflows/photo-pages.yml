name: Publish site with OneDrive photos
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ONEDRIVE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          python3 -m venv "$RUNNER_TEMP/gallery"
          "$RUNNER_TEMP/gallery/bin/pip" install Pillow
      - name: Render the complete album
        env:
          MS_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: '"$RUNNER_TEMP/gallery/bin/python" .github/scripts/photo_gallery.py _site'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
